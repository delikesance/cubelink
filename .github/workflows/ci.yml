# Vérifications à chaque push sur `development` et à chaque pull request vers `main` (aucune release ici).
name: ci

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: bash core/resources/lan-agent/build.sh
        shell: bash
      # clippy -D warnings + cargo test --workspace + tsc + vitest
      - run: npm test

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils build-essential
      - run: npm ci
      - run: bash core/resources/lan-agent/build.sh
      # Le build Linux ne doit pas casser sans que personne ne le voie : compilation complète (l'AppImage est produite par `release`).
      - run: cargo check --workspace --all-targets
