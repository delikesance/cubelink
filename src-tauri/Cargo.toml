[package]
name = "cubelink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "cubelink_app"
path = "src/lib.rs"

[[bin]]
name = "cubelink"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
cubelink-core = { path = "../core" }
cubelink-p2p = { path = "../p2p" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
base64 = "0.23"
iroh = "=1.5.0"
iroh-blobs = "=0.105.0"
hex.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy = "0.15"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "=0.0.15"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
cubelink-host = { path = "../host" }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
# Sonde D-Bus du StatusNotifierWatcher (background.rs) : sans hôte de zone de notification, fermer quitte.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
zip.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
