[package]
name = "cubelink-core"
version.workspace = true
edition.workspace = true

[lib]
name = "core_lib"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
md-5.workspace = true
uuid.workspace = true
rusqlite.workspace = true
zip.workspace = true
# JRE Adoptium Linux/macOS (.tar.gz).
flate2 = "1"
tar = { version = "0.4", default-features = false }
same-file = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
url.workspace = true
aes-gcm.workspace = true
rand.workspace = true
hex.workspace = true
futures-util.workspace = true
tracing.workspace = true
base64 = "0.22"
ammonia = "4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
# Seulement pour `hidden_spawn` (essai « fenêtre du jeu cachée au départ ») ; `Win32_UI_Shell` : ses tests.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
proptest.workspace = true
