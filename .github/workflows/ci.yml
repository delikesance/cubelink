# Vérifications à chaque pull request et à chaque push vers `canary` et `main` (aucune release ici).
# Les jobs tournent EN PARALLÈLE (le front est rapide, le Rust est la partie longue).
# Sur un push vers `canary`, la pré-version canary (canary.yml) n'est publiée que si les vérifications passent.
# Actions épinglées par SHA (le commentaire donne la version) : dependabot.yml les tient à jour.
name: ci

on:
  push:
    branches: [canary, main]
  pull_request:
    branches: [canary, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0          # inutile en CI et alourdit le cache
  CARGO_PROFILE_DEV_DEBUG: 0    # pas d'infos de debogage : compilation et cache nettement plus legers
  CARGO_TERM_COLOR: always

jobs:
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:front

  agent-lan-java8:
    # L'agent LAN est compilé --release 8 avec un JDK 17 (build.sh) puis exécuté sur de vrais JVM 8 et 17 (stubs legacy
    # SRG 1.7.10 / 1.12.2 et stubs modernes) : un UnsupportedClassVersionError ou une régression Java 8 casse la CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        id: jdk8
        with: { distribution: temurin, java-version: 8 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        id: jdk17
        with: { distribution: temurin, java-version: 17 }
      - name: Construit l'agent (JDK 17, --release 8)
        run: JAVA_HOME="${{ steps.jdk17.outputs.path }}" bash core/resources/lan-agent/build.sh
      - name: Teste l'agent sous Java 8 et Java 17
        run: |
          out=$(JAVA_HOME="${{ steps.jdk17.outputs.path }}" bash core/resources/lan-agent/run-legacy-test.sh \
            "${{ steps.jdk8.outputs.path }}/bin/java" "${{ steps.jdk17.outputs.path }}/bin/java") || { echo "$out"; exit 1; }
          echo "$out"
          # Garde-fou : le test doit avoir tourné sur un vrai Java 8, pas seulement 17.
          echo "$out" | grep -q 'Java 8 reel : TESTE'

  clippy-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installe le compilateur de rust-toolchain.toml (version et composants).
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-clippy-win
          save-if: ${{ github.event_name == 'push' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test-win
          save-if: ${{ github.event_name == 'push' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo test --workspace

  # Linux : clippy et tests complets. Les scénarios X11 de la Scène (host/tests) ouvrent de vraies fenêtres :
  # ils tournent sous un serveur X virtuel (xvfb-run).
  clippy-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-clippy-linux
          save-if: ${{ github.event_name == 'push' }}
      - name: Dépendances système
        run: bash scripts/ci-apt.sh
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test-linux
          save-if: ${{ github.event_name == 'push' }}
      - name: Dépendances système (avec Xvfb)
        run: bash scripts/ci-apt.sh xvfb
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: xvfb-run -a cargo test --workspace

  # E2E Playwright en mode simulé : l'app Tauri réelle (deux profils) contre de faux serveurs locaux
  # (auth, Mojang, Modrinth) et un faux Java. Le harnais pilote WebView2 par CDP : Windows seulement.
  # Les scénarios réels (E2E_REAL, E2E_MC, E2E_SLOW) s'ignorent d'eux-mêmes sans leur variable.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-e2e-win
          save-if: ${{ github.event_name == 'push' }}
      - run: npm ci --ignore-scripts
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - name: Binaire de test (front embarqué)
        run: node e2e/harness/build.mjs
      - name: Playwright (mode simulé)
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          E2E_WORKERS: '2'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Licences, sources et crates interdites (deny.toml). Bloquant.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  # Vulnérabilités connues (base RustSec). Séparé de `deny` : une alerte peut tomber n'importe quel jour sans
  # changement de code, elle doit se voir mais ne bloque pas la publication canary.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # Pré-version canary : seulement après un push sur `canary` et si toutes les vérifications ont réussi.
  canary:
    needs: [front, agent-lan-java8, clippy-windows, tests-windows, clippy-linux, tests-linux, e2e-windows, deny]
    if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
    permissions:
      contents: write
    uses: ./.github/workflows/canary.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
