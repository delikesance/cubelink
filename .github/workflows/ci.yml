# Vérifications à chaque pull request et à chaque push vers `canary` et `main`.
# Les jobs tournent EN PARALLÈLE (le front est rapide, le Rust est la partie longue).
# Sur un push vers `canary`, la pré-version canary (canary.yml) n'est publiée que si les vérifications passent ;
# sur un push vers `main`, c'est la release (release.yml) : rien n'est publié tant qu'une vérification est rouge.
# Actions épinglées par SHA (le commentaire donne la version) : dependabot.yml les tient à jour.
name: ci

on:
  push:
    branches: [canary, main]
    # Une doc seule ne relance pas tout (ni ne publie de pré-version identique). Les PR, elles, sont toujours vérifiées.
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    branches: [canary, main]

permissions:
  contents: read

# Une PR mise à jour annule son run précédent. Un push sur canary/main n'est jamais annulé : sinon deux merges
# rapprochés couperaient la publication canary du premier en plein build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0          # inutile en CI et alourdit le cache
  CARGO_PROFILE_DEV_DEBUG: 0    # pas d'infos de debogage : compilation et cache nettement plus legers
  CARGO_TERM_COLOR: always

jobs:
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:front

  agent-lan-java8:
    # L'agent LAN est compilé --release 8 avec un JDK 17 (build.sh) puis exécuté sur de vrais JVM 8 et 17 (stubs legacy
    # SRG 1.7.10 / 1.12.2 et stubs modernes) : un UnsupportedClassVersionError ou une régression Java 8 casse la CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        id: jdk8
        with: { distribution: temurin, java-version: 8 }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        id: jdk17
        with: { distribution: temurin, java-version: 17 }
      - name: Construit l'agent (JDK 17, --release 8)
        run: JAVA_HOME="${{ steps.jdk17.outputs.path }}" bash core/resources/lan-agent/build.sh
      - name: Teste l'agent sous Java 8 et Java 17
        run: |
          out=$(JAVA_HOME="${{ steps.jdk17.outputs.path }}" bash core/resources/lan-agent/run-legacy-test.sh \
            "${{ steps.jdk8.outputs.path }}/bin/java" "${{ steps.jdk17.outputs.path }}/bin/java") || { echo "$out"; exit 1; }
          echo "$out"
          # Garde-fou : le test doit avoir tourné sur un vrai Java 8, pas seulement 17.
          echo "$out" | grep -q 'Java 8 reel : TESTE'

  clippy-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installe le compilateur de rust-toolchain.toml (version et composants).
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-clippy-win
          save-if: ${{ github.event_name == 'push' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test-win
          save-if: ${{ github.event_name == 'push' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo test --workspace

  # Linux : clippy et tests complets. Les scénarios X11 de la Scène (host/tests) ouvrent de vraies fenêtres :
  # ils tournent sous un serveur X virtuel (xvfb-run).
  clippy-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-clippy-linux
          save-if: ${{ github.event_name == 'push' }}
      - name: Dépendances système
        run: bash scripts/ci-apt.sh
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test-linux
          save-if: ${{ github.event_name == 'push' }}
      - name: Dépendances système (avec Xvfb)
        run: bash scripts/ci-apt.sh xvfb openbox
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      # CUBELINK_REQUIRE_WM : sans openbox, le test X11 du mode transitoire échoue au lieu de s'ignorer en silence
      - run: xvfb-run -a cargo test --workspace
        env:
          CUBELINK_REQUIRE_WM: "1"
      # Scène X11 sur deux moniteurs : la racine doit faire 3840x1080 d'emblée (sous l'écran par défaut, le test s'ignore)
      # CUBELINK_REQUIRE_MULTIHEAD : si le serveur refuse de décrire deux moniteurs, le test échoue au lieu de s'ignorer
      - run: xvfb-run -a -s "-screen 0 3840x1080x24" cargo test -p cubelink-host --test x11_fullscreen_multihead
        env:
          CUBELINK_REQUIRE_MULTIHEAD: "1"

  # E2E Playwright en mode simulé : l'app Tauri réelle (deux profils) contre de faux serveurs locaux
  # (auth, Mojang, Modrinth) et un faux Java. Le harnais pilote WebView2 par CDP : Windows seulement.
  # Les scénarios réels (E2E_REAL, E2E_MC, E2E_SLOW) s'ignorent d'eux-mêmes sans leur variable.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-e2e-win
          save-if: ${{ github.event_name == 'push' }}
      - run: npm ci --ignore-scripts
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - name: Harnais E2E (logique de reconstruction)
        run: npm run test:e2e-harness
      - name: Binaire de test (front embarqué)
        run: node e2e/harness/build.mjs
      - name: Playwright (mode simulé)
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          E2E_WORKERS: '2'
          CUBELINK_E2E_SKIP_BUILD: '1' # déjà construit à l'étape précédente
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Essai réel Linux, NON BLOQUANT (ticket #129) : l'app Tauri réelle sous Xvfb + openbox. bindings-real.mjs la pilote par
  # WebDriver (tauri-driver + WebKitWebDriver) et vérifie que chaque commande atteint Rust avec les bons arguments ;
  # background.sh vérifie tray/autostart/instance unique et « fermer = masquer ». Le binaire est le build debug (il charge
  # l'interface depuis Vite, que les deux scripts démarrent eux-mêmes). Premier essai : jamais prouvé vert, donc
  # `continue-on-error` et absent de `needs` (canary, release). Le promouvoir en bloquant (le remettre dans `needs` des deux
  # jobs) seulement après un run vert, sur confirmation du mainteneur, comme `e2e-windows`.
  e2e-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    continue-on-error: true
    env:
      TAURI_DRIVER_VERSION: '2.1.0' # version figée (reproductible)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-e2e-linux
          save-if: ${{ github.event_name == 'push' }}
      - name: Dépendances système (Xvfb, openbox, WebDriver)
        run: bash scripts/ci-apt.sh xvfb webkit2gtk-driver openbox xdotool wmctrl x11-utils dbus-x11 python3-gi
      - run: npm ci --ignore-scripts
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      # rust-cache met aussi en cache ~/.cargo/bin (cache-bin) : l'installation (longue) n'a lieu qu'au premier run.
      - name: Installe tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      - name: Binaire debug
        run: cargo build -p cubelink
      - name: Liaisons réelles (WebDriver)
        run: xvfb-run -a node e2e/linux/bindings-real.mjs
      - name: Tray, autostart, instance unique, fermer = masquer
        if: always()
        run: bash e2e/linux/background.sh
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/e2e/artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-linux-artifacts
          path: e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Licences, sources et crates interdites (deny.toml). Bloquant.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check bans licenses sources

  # Vulnérabilités connues (base RustSec). Séparé de `deny` : une alerte peut tomber n'importe quel jour sans
  # changement de code, elle doit se voir mais ne bloque pas la publication canary.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories

  # Pré-version canary : seulement après un push sur `canary` et si les vérifications ont réussi.
  # `e2e-windows` n'en fait pas (encore) partie, par décision du mainteneur (2026-11-14) : des scénarios ne suivaient plus
  # l'interface actuelle (ticket #66, specs remises à jour ; pas de nombre en dur, `playwright test --list` donne le compte).
  # `e2e-linux` (essai réel Linux) est dans le même cas.
  # Le job tourne toujours ; le remettre dans `needs` dès qu'un run Windows complet est vert (ici et dans `release`, qui a la
  # même liste), sur confirmation du mainteneur.
  canary:
    needs: [front, agent-lan-java8, clippy-windows, tests-windows, clippy-linux, tests-linux, deny]
    if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
    permissions:
      contents: write
    uses: ./.github/workflows/canary.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # Release : seulement après un push sur `main` et si les vérifications ont réussi (mêmes jobs que canary, mêmes
  # exceptions : `e2e-windows` et `advisories` ne bloquent pas). release.yml n'a plus de déclencheur `push` propre.
  # Le job appelant doit porter `contents: write` : un workflow appelé ne peut pas élargir les permissions de l'appelant.
  release:
    needs: [front, agent-lan-java8, clippy-windows, tests-windows, clippy-linux, tests-linux, deny]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CUBELINK_CF_API_KEY: ${{ secrets.CUBELINK_CF_API_KEY }}
      CUBELINK_MS_CLIENT_ID: ${{ secrets.CUBELINK_MS_CLIENT_ID }}
