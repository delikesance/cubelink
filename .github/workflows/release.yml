# Build + release automatiques : chaque merge dans `main` produit un nouveau tag `vMAJEUR.MINEUR.<run>` et une release GitHub
# avec l'installeur Windows (.msi), l'AppImage Linux et latest.json (lu par l'updater du launcher).
# Flux de travail : les PR sont fusionnées dans `canary`, puis `canary` est fusionnée dans `main` (voir docs/release.md).
# `workflow_dispatch` (depuis n'importe quelle branche) construit tout SANS publier, pour vérifier les builds.
# Windows : .msi (updater) + paquet .msix à téléverser dans le Microsoft Store (qui le signe).
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']   # une simple doc ne produit pas de release
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier la release (tag + fichiers) ; sinon build seul'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Les secrets ne sont PAS dans l'environnement global : seules les étapes `tauri build` les reçoivent,
  # pour que ni npm ni les autres étapes ne les voient.
  # - TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) : signature des mises à jour (`tauri signer generate`).
  # - CUBELINK_CF_API_KEY : clé de développeur CurseForge, embarquée à la compilation (`option_env!`).
  #   Extractible de l'installeur : choix assumé, comme les autres launchers.
  # - CUBELINK_MS_CLIENT_ID : identifiant Azure (facultatif, l'app a une valeur par défaut).

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-tags: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - id: v
        shell: bash
        run: |
          version=$(node scripts/release-version.mjs "$GITHUB_RUN_NUMBER")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Le tag v$version existe déjà" >&2; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::warning::secret TAURI_SIGNING_PRIVATE_KEY absent : les mises à jour ne seront pas signées"; fi
          # Sans clé CurseForge, l'app publiée retomberait sur Modrinth seul (mods CurseForge « hors catalogue ») : on refuse de publier.
          if [ -z "$CUBELINK_CF_API_KEY" ]; then
            if [ "$publish" = "true" ]; then echo "::error::secret CUBELINK_CF_API_KEY absent : publication refusée (mods CurseForge non reconnus)"; exit 1; fi
            echo "::warning::secret CUBELINK_CF_API_KEY absent : build sans CurseForge"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CUBELINK_CF_API_KEY: ${{ secrets.CUBELINK_CF_API_KEY }}

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci --ignore-scripts
      - name: Version
        shell: bash
        run: node scripts/release-version.mjs "$GITHUB_RUN_NUMBER" --write
      - name: Agent LAN (jar Java)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - name: Installeur MSI
        run: npx tauri build --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CUBELINK_CF_API_KEY: ${{ secrets.CUBELINK_CF_API_KEY }}
          CUBELINK_MS_CLIENT_ID: ${{ secrets.CUBELINK_MS_CLIENT_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi
      # Paquet MSIX pour le Microsoft Store (non signé : le Store le signe). Les valeurs d'identité viennent du Partner Center
      # (variables de dépôt MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME) ; sans elles, paquet de test.
      - name: Paquet MSIX (Microsoft Store)
        shell: pwsh
        run: >
          scripts/make-msix.ps1
          -Version "${{ needs.version.outputs.version }}"
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Cubelink.Placeholder' }}"
          -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=Placeholder' }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Cubelink' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msix
          path: target/release/bundle/msix/*.msix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-sig
          path: target/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dépendances système
        run: bash scripts/ci-apt.sh
      - run: npm ci --ignore-scripts
      - name: Version
        run: node scripts/release-version.mjs "$GITHUB_RUN_NUMBER" --write
      - name: Agent LAN (jar Java)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - name: AppImage
        run: npx tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CUBELINK_CF_API_KEY: ${{ secrets.CUBELINK_CF_API_KEY }}
          CUBELINK_MS_CLIENT_ID: ${{ secrets.CUBELINK_MS_CLIENT_ID }}
      # libgcrypt est embarquée mais linuxdeploy exclut libgpg-error, dont elle dépend : sur une distribution qui
      # ne l'a pas, le launcher ne démarre pas (« libgpg-error.so.0: cannot open shared object file »).
      # tauri.linux.conf.json l'ajoute ; on vérifie que toute bibliothèque embarquée trouve ses dépendances.
      - name: AppImage autonome (dépendances des bibliothèques embarquées)
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libgpg-error.so.0 || { echo "libgpg-error.so.0 absente de l'AppImage" >&2; exit 1; }
          ldd squashfs-root/usr/lib/libgcrypt.so.20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  release:
    needs: [version, build-windows, build-linux]
    # Les deux builds doivent réussir.
    timeout-minutes: 15
    if: ${{ always() && needs.version.outputs.publish == 'true' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts }
      - name: Rassembler les signatures de mise à jour
        shell: bash
        # Les .sig doivent se trouver à côté des fichiers pour make-latest-json.
        run: cp artifacts/windows-sig/*.sig artifacts/windows-msi/ 2>/dev/null || true
      - name: Notes + latest.json
        shell: bash
        run: |
          set -euo pipefail
          git log -20 --pretty='- %s' > notes.md
          node scripts/make-latest-json.mjs artifacts "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.tag }}" notes.md "$GITHUB_REPOSITORY"
      - name: Tag + release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Cubelink ${{ needs.version.outputs.version }}" --notes-file notes.md \
            artifacts/windows-msi/*.msi artifacts/windows-msi/*.msi.sig \
            artifacts/windows-msix/*.msix \
            artifacts/linux-appimage/*.AppImage artifacts/linux-appimage/*.AppImage.sig \
            artifacts/latest.json
      - name: Paquet Nix (artefact de release, non bloquant)
        # Aucun push dans le depot : package.nix mis a jour est seulement joint a la release.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp packaging/nix/package.nix packaging/nix/flake.nix packaging/nix/shell.nix artifacts/
          node scripts/nix-bump.mjs artifacts/latest.json artifacts/linux-appimage/*.AppImage artifacts/package.nix
          gh release upload "${{ needs.version.outputs.tag }}" artifacts/package.nix --clobber
