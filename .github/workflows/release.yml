# Build + release automatiques : chaque merge dans `main` produit un nouveau tag `vMAJEUR.MINEUR.<run>` et une release GitHub
# avec l'installeur Windows (.msi), l'AppImage Linux et latest.json (lu par l'updater du launcher).
# Flux de travail : on pousse sur `development`, puis on merge dans `main`.
# `workflow_dispatch` (depuis n'importe quelle branche) construit tout SANS publier, pour vérifier les builds.
# Windows : .msi (updater) + paquet .msix à téléverser dans le Microsoft Store (qui le signe).
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']   # une simple doc ne produit pas de release
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier la release (tag + fichiers) ; sinon build seul'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Clé de signature des mises à jour (générée par `tauri signer generate`, sans mot de passe).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-tags: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        shell: bash
        run: |
          version=$(node scripts/release-version.mjs "$GITHUB_RUN_NUMBER")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Le tag v$version existe déjà" >&2; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::warning::secret TAURI_SIGNING_PRIVATE_KEY absent : les mises à jour ne seront pas signées"; fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Version
        shell: bash
        run: node scripts/release-version.mjs "$GITHUB_RUN_NUMBER" --write
      - name: Agent LAN (jar Java)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      # Pas de CUBELINK_CF_API_KEY ici : une clé embarquée serait extractible de l'installeur public.
      - name: Installeur MSI
        run: npx tauri build --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi
      # Paquet MSIX pour le Microsoft Store (non signé : le Store le signe). Les valeurs d'identité viennent du Partner Center
      # (variables de dépôt MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME) ; sans elles, paquet de test.
      - name: Paquet MSIX (Microsoft Store)
        shell: pwsh
        run: >
          scripts/make-msix.ps1
          -Version "${{ needs.version.outputs.version }}"
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Cubelink.Placeholder' }}"
          -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=Placeholder' }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Cubelink' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: target/release/bundle/msix/*.msix
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: target/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dépendances système (miroir kernel.org car les noms ubuntu.com ne résolvent plus depuis les runners)
        run: |
          sudo tee /etc/apt/sources.list >/dev/null <<'LIST'
          deb http://mirrors.edge.kernel.org/ubuntu jammy main restricted universe multiverse
          deb http://mirrors.edge.kernel.org/ubuntu jammy-updates main restricted universe multiverse
          deb http://mirrors.edge.kernel.org/ubuntu jammy-security main restricted universe multiverse
          LIST
          pkgs='libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils'
          for i in 1 2 3; do
            sudo timeout 240 apt-get update && sudo timeout 600 apt-get install -y --no-install-recommends $pkgs && break
            echo "apt : essai $i échoué, nouvel essai"; sleep 5
            [ $i = 3 ] && exit 1
          done
      - run: npm ci
      - name: Version
        run: node scripts/release-version.mjs "$GITHUB_RUN_NUMBER" --write
      - name: Agent LAN (jar Java)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - name: AppImage
        run: npx tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  release:
    needs: [version, build-windows, build-linux]
    # Les deux builds doivent réussir.
    timeout-minutes: 15
    if: ${{ always() && needs.version.outputs.publish == 'true' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Rassembler les signatures de mise à jour
        shell: bash
        # Les .sig doivent se trouver à côté des fichiers pour make-latest-json.
        run: cp artifacts/windows-sig/*.sig artifacts/windows-msi/ 2>/dev/null || true
      - name: Notes + latest.json
        shell: bash
        run: |
          set -euo pipefail
          git log -20 --pretty='- %s' > notes.md
          node scripts/make-latest-json.mjs artifacts "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.tag }}" notes.md "$GITHUB_REPOSITORY"
      - name: Tag + release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Cubelink ${{ needs.version.outputs.version }}" --notes-file notes.md \
            artifacts/windows-msi/*.msi artifacts/windows-msi/*.msi.sig \
            artifacts/windows-msix/*.msix \
            artifacts/linux-appimage/*.AppImage artifacts/linux-appimage/*.AppImage.sig \
            artifacts/latest.json
