# Vérifications à chaque push sur `development` et à chaque pull request vers `main` (aucune release ici).
# Cinq jobs indépendants qui tournent EN PARALLÈLE (le front est rapide, le Rust est la partie longue).
name: ci

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0          # inutile en CI et alourdit le cache
  CARGO_PROFILE_DEV_DEBUG: 0    # pas d'infos de debogage : compilation et cache nettement plus legers
  CARGO_TERM_COLOR: always

jobs:
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:front

  agent-lan-java8:
    # L'agent LAN est compilé --release 8 avec un JDK 17 (build.sh) puis exécuté sur de vrais JVM 8 et 17 (stubs legacy
    # SRG 1.7.10 / 1.12.2 et stubs modernes) : un UnsupportedClassVersionError ou une régression Java 8 casse la CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk8
        with: { distribution: temurin, java-version: 8 }
      - uses: actions/setup-java@v4
        id: jdk17
        with: { distribution: temurin, java-version: 17 }
      - name: Construit l'agent (JDK 17, --release 8)
        run: JAVA_HOME="${{ steps.jdk17.outputs.path }}" bash core/resources/lan-agent/build.sh
      - name: Teste l'agent sous Java 8 et Java 17
        run: |
          out=$(JAVA_HOME="${{ steps.jdk17.outputs.path }}" bash core/resources/lan-agent/run-legacy-test.sh \
            "${{ steps.jdk8.outputs.path }}/bin/java" "${{ steps.jdk17.outputs.path }}/bin/java") || { echo "$out"; exit 1; }
          echo "$out"
          # Garde-fou : le test doit avoir tourné sur un vrai Java 8, pas seulement 17.
          echo "$out" | grep -q 'Java 8 reel : TESTE'

  clippy-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-win
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-win
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo test --workspace

  check-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check-linux
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Dépendances système (miroir kernel.org car les noms ubuntu.com ne résolvent plus depuis les runners)
        run: |
          sudo tee /etc/apt/sources.list >/dev/null <<'LIST'
          deb http://mirrors.edge.kernel.org/ubuntu jammy main restricted universe multiverse
          deb http://mirrors.edge.kernel.org/ubuntu jammy-updates main restricted universe multiverse
          deb http://mirrors.edge.kernel.org/ubuntu jammy-security main restricted universe multiverse
          LIST
          pkgs='libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils'
          for i in 1 2 3; do
            sudo timeout 240 apt-get update && sudo timeout 600 apt-get install -y --no-install-recommends $pkgs && break
            echo "apt : essai $i échoué, nouvel essai"; sleep 5
            [ $i = 3 ] && exit 1
          done
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      # Le build Linux ne doit pas casser sans que personne ne le voie ; l'AppImage elle-même est produite par `release`.
      - run: cargo check --workspace --all-targets
