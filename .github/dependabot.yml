# Mises à jour automatiques des dépendances : une PR par semaine et par écosystème, vers `canary`.
# Les actions GitHub sont épinglées par SHA : dependabot met à jour le SHA et le commentaire de version.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: canary
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      cargo-mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: canary
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: canary
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
