[workspace]
resolver = "2"
members = ["core", "p2p", "src-tauri", "host"]
exclude = ["spike/p2p-tunnel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
md-5 = "0.11"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2"
aes-gcm = "0.11"
# Sauvegarde chiffrée de l'identité (.cubelink-id) : Argon2id + XChaCha20-Poly1305.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1"
rand = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
data-encoding = "2"
hex = "0.4"
futures-util = "0.3"
blake3 = "1.8"
tracing = "0.1"
# Journal applicatif (src-tauri/src/app_log.rs) : seulement le registre et le filtre ; l'ecriture passe par stage_log::Outbox.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter"] }
# Types et liaisons TypeScript générés depuis Rust (src/services/bindings.ts).
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
# dev
tempfile = "3"
wiremock = "0.6"
proptest = "1"

# Dev/test : tables de lignes seulement sur le workspace et aucun DWARF sur les dépendances
# (divise la taille des binaires et la RAM au link ; la CI surcharge via CARGO_PROFILE_DEV_DEBUG=0).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# Le rideau de chargement dessine ~30 images/s : ses dependances de rendu restent optimisees meme en debug.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
[profile.dev.package.ab_glyph]
opt-level = 3
[profile.dev.package.cubelink-host]
opt-level = 3
# Argon2id (sauvegarde d'identité) : 64 Mio x 3 passes, inutilisable sans optimisation même en debug.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# LTO léger et compilation parallèle : la release se construit en quelques minutes en CI (fat + 1 unité doublait le temps
# pour un gain négligeable sur un launcher).
lto = "thin"
codegen-units = 16
strip = true
opt-level = 3
