# Vérifications à chaque push sur `development` et à chaque pull request vers `main` (aucune release ici).
# Quatre jobs indépendants qui tournent EN PARALLÈLE (le front est rapide, le Rust est la partie longue).
name: ci

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0          # inutile en CI et alourdit le cache
  CARGO_PROFILE_DEV_DEBUG: 0    # pas d'infos de debogage : compilation et cache nettement plus legers
  CARGO_TERM_COLOR: always

jobs:
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:front

  clippy-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-win
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-win
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - run: cargo test --workspace

  check-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check-linux
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: apt robuste (le miroir Azure des runners résout parfois mal son DNS)
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99ci
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt || true
      - name: Dépendances système (mises en cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils
          version: 1.0
      - name: Agent LAN (JDK 17 préinstallé sur le runner)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      # Le build Linux ne doit pas casser sans que personne ne le voie ; l'AppImage elle-même est produite par `release`.
      - run: cargo check --workspace --all-targets
