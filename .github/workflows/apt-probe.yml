# Test jetable (à supprimer)
name: apt-probe
on:
  push:
    branches: [development]
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - run: |
          grep -E 'VERSION_CODENAME|PRETTY' /etc/os-release; dpkg --print-architecture; dpkg --print-foreign-architectures
          ls /etc/apt/sources.list.d/
          sudo tee /etc/apt/sources.list >/dev/null <<'LIST'
          deb http://mirrors.edge.kernel.org/ubuntu jammy main restricted universe multiverse
          deb http://mirrors.edge.kernel.org/ubuntu jammy-updates main restricted universe multiverse
          deb http://mirrors.edge.kernel.org/ubuntu jammy-security main restricted universe multiverse
          LIST
          sudo apt-get update 2>&1 | grep -E "^(Err|W:|E:)|Ign" | head
          apt-cache policy libwebkit2gtk-4.1-dev | head -8
          apt-cache search libwebkit2gtk | head
          head -3 /etc/apt/sources.list
