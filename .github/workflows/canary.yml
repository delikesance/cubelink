# Canary : chaque push sur la branche `canary` publie une pré-version Linux (AppImage seule) pour tester.
# Appelé par ci.yml (job `canary`) seulement quand toutes les vérifications ont réussi : jamais de pré-version cassée.
# Pré-version (jamais « Latest »), sans latest.json : les launchers installés ne la reçoivent pas en mise à jour.
# Version `<majeur>.<mineur>.<patch suivant>-canary.<run>` : la vraie release suivante la remplacera normalement.
name: canary

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Pas l'optimisation des vraies releases (LTO « fat » + 1 unité de compilation : édition de liens de plusieurs
  # minutes) : canary = compilation rapide, binaire un peu plus gros et lent, sans importance pour tester.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  # Les secrets ne sont PAS ici : seule l'étape `tauri build` les reçoit (ni npm ni les autres étapes ne les voient).

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: canary-${{ runner.os }}
      # Éditeur de liens rapide (mold) au lieu de celui par défaut.
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - name: Dépendances système
        run: bash scripts/ci-apt.sh
      # --ignore-scripts : aucun script d'installation d'un paquet npm ne s'exécute sur la machine de build.
      - run: npm ci --ignore-scripts
      - name: Version
        id: v
        run: |
          set -euo pipefail
          last=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          next=$(echo "$last" | awk -F. '{print $1"."$2"."$3+1}')
          # Numéro du run `ci` appelant ; une relance du même run ajoute son numéro d'essai (sinon le tag existerait déjà).
          version="$next-canary.$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then version="$version.$GITHUB_RUN_ATTEMPT"; fi
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]+(\")/\1$version\2/" src-tauri/tauri.conf.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Agent LAN (jar Java)
        run: JAVA_HOME="$JAVA_HOME_17_X64" bash core/resources/lan-agent/build.sh
      - name: AppImage
        run: npx tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: AppImage autonome
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libgpg-error.so.0
      - name: Pré-version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          git log -10 --pretty='- %s' > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --prerelease --latest=false --title "Cubelink $v (canary, Linux)" --notes-file notes.md \
            target/release/bundle/appimage/*.AppImage
